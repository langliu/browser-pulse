<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Browser Pulse 采集代码测试</title>
    <style>
      :root {
        color: #173a40;
        background: #edf7f2;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 48px 20px;
        background:
          radial-gradient(circle at 20% 10%, #ffffff 0, transparent 32%),
          linear-gradient(135deg, #eff8f4, #e6f4ee);
      }

      main {
        width: min(760px, 100%);
        margin: 0 auto;
      }

      h1 {
        margin: 0;
        font-family: ui-serif, Georgia, serif;
        font-size: clamp(2rem, 6vw, 3.5rem);
        line-height: 1.05;
      }

      .description {
        margin: 16px 0 28px;
        color: #416166;
        line-height: 1.7;
      }

      .card {
        padding: 24px;
        border: 1px solid rgba(47, 106, 74, 0.2);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 24px 80px rgba(23, 58, 64, 0.1);
      }

      .field + .field {
        margin-top: 18px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 0.9rem;
        font-weight: 650;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #bed5cc;
        border-radius: 10px;
        color: inherit;
        background: #fff;
        font: inherit;
      }

      input:focus {
        border-color: #2f6a4a;
        outline: 3px solid rgba(47, 106, 74, 0.12);
      }

      button {
        margin-top: 20px;
        padding: 12px 18px;
        border: 0;
        border-radius: 10px;
        color: #fff;
        background: #2f6a4a;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.6;
      }

      .hint {
        margin: 8px 0 0;
        color: #60787c;
        font-size: 0.82rem;
        line-height: 1.55;
      }

      .result {
        min-height: 88px;
        margin: 22px 0 0;
        padding: 16px;
        overflow: auto;
        border: 1px solid #bed5cc;
        border-radius: 12px;
        color: #d7ece8;
        background: #102327;
        font:
          0.85rem/1.6 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        white-space: pre-wrap;
      }

      .privacy {
        margin-top: 20px;
        padding-top: 18px;
        border-top: 1px solid #dce9e4;
        color: #416166;
        font-size: 0.88rem;
        line-height: 1.65;
      }

      code {
        padding: 0.15em 0.35em;
        border-radius: 5px;
        background: rgba(47, 106, 74, 0.1);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>采集代码测试</h1>
      <p class="description">
        填入项目页中的公开采集键，然后显式调用内联
        <code>collectBrowserPulse()</code>。同一页面重复点击只发送一次请求。
      </p>

      <section class="card" aria-labelledby="test-title">
        <h2 id="test-title">测试配置</h2>
        <form id="collector-form">
          <div class="field">
            <label for="collector-origin">采集服务地址</label>
            <input
              id="collector-origin"
              name="collectorOrigin"
              type="url"
              value="http://localhost:3000"
              required
            />
          </div>

          <div class="field">
            <label for="collector-key">公开采集键</label>
            <input
              id="collector-key"
              name="collectorKey"
              type="text"
              autocomplete="off"
              spellcheck="false"
              placeholder="从项目的“采集键”标签复制 bpc_live_..."
              required
            />
            <p class="hint">
              当前页面的 Origin 必须已经加入该项目的允许列表。本地默认是
              <code>http://localhost:3000</code>。
            </p>
          </div>

          <button id="collect-button" type="submit">发送一次采集事件</button>
        </form>

        <pre id="collector-result" class="result" aria-live="polite">等待测试</pre>

        <p class="privacy">
          此测试不会创建访客 ID、Cookie 或本地存储，也不会上传原始 User-Agent。
          修改配置后会创建新的页面内采集实例；刷新页面可重新测试同一个采集键。
        </p>
      </section>
    </main>

    <script>
      const createBrowserPulseCollector = (endpoint) => {
        let firstRequest
        const match = (value, rules) => {
          for (const [pattern, family] of rules) {
            const found = value.match(pattern)
            if (found) return { family, major: found[1] || null }
          }
          return null
        }
        const detect = () => {
          const ua = navigator.userAgent || ''
          const data = navigator.userAgentData
          let browser = null
          let detectionSource = 'unknown'
          if (data?.brands) {
            const rules = [
              [/Microsoft Edge/i, 'Edge'],
              [/\bOpera\b/i, 'Opera'],
              [/Google Chrome/i, 'Chrome'],
              [/\bChromium\b/i, 'Chrome'],
            ]
            for (const [pattern, family] of rules) {
              const brand = data.brands.find((item) => pattern.test(item.brand))
              if (brand) {
                browser = {
                  family,
                  major: /^\d+/.exec(String(brand.version))?.[0] || null,
                }
                detectionSource = 'ua_ch'
                break
              }
            }
          }
          if (!browser) {
            browser = match(ua, [
              [/SamsungBrowser\/(\d+)/, 'Samsung Internet'],
              [/Edg(?:A|iOS)?\/(\d+)/, 'Edge'],
              [/OPR\/(\d+)/, 'Opera'],
              [/CriOS\/(\d+)/, 'Chrome'],
              [/Chrome\/(\d+)/, 'Chrome'],
              [/FxiOS\/(\d+)/, 'Firefox'],
              [/Firefox\/(\d+)/, 'Firefox'],
              [/Version\/(\d+).+Safari\//, 'Safari'],
            ])
            if (browser) detectionSource = 'user_agent_fallback'
          }
          const touchMac = /Macintosh/.test(ua) && Number(navigator.maxTouchPoints) > 1
          const platform = String(data?.platform || '').toLowerCase()
          const platforms = {
            windows: 'Windows',
            macos: 'macOS',
            ios: 'iOS',
            android: 'Android',
            linux: 'Linux',
            'chrome os': 'ChromeOS',
          }
          let osFamily = platforms[platform]
          if (!osFamily) {
            if (/iPhone|iPad|iPod/.test(ua) || touchMac) osFamily = 'iOS'
            else if (/Android/.test(ua)) osFamily = 'Android'
            else if (/Windows NT/.test(ua)) osFamily = 'Windows'
            else if (/CrOS/.test(ua)) osFamily = 'ChromeOS'
            else if (/Macintosh|Mac OS X/.test(ua)) osFamily = 'macOS'
            else if (/Linux/.test(ua)) osFamily = 'Linux'
            else osFamily = ua || platform ? 'Other' : 'Unknown'
          }
          let deviceClass = 'Unknown'
          if (/iPad/.test(ua) || touchMac || (/Android/.test(ua) && !/Mobile/.test(ua))) {
            deviceClass = 'Tablet'
          } else if (data?.mobile || /iPhone|iPod|Android.+Mobile|Mobile/.test(ua)) {
            deviceClass = 'Mobile'
          } else if (['Windows', 'macOS', 'Linux', 'ChromeOS'].includes(osFamily)) {
            deviceClass = 'Desktop'
          } else if (ua || platform) {
            deviceClass = 'Other'
          }
          return {
            browserFamily: browser?.family || 'Unknown',
            browserMajor: browser?.major || null,
            osFamily,
            deviceClass,
            detectionSource,
            snippetVersion: '1.0.0',
          }
        }
        return function collectBrowserPulse() {
          if (firstRequest) return firstRequest
          firstRequest = fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
            body: JSON.stringify(detect()),
            keepalive: true,
          })
            .then((response) => {
              if (response.status === 202) return { status: 'accepted' }
              const reasons = {
                400: 'invalid_payload',
                401: 'invalid_key',
                403: 'origin_not_allowed',
                413: 'invalid_payload',
                429: 'rate_limited',
              }
              return {
                status: 'rejected',
                reason: reasons[response.status] || 'server_error',
              }
            })
            .catch(() => ({ status: 'rejected', reason: 'network_error' }))
          return firstRequest
        }
      }

      const form = document.querySelector('#collector-form')
      const originInput = document.querySelector('#collector-origin')
      const keyInput = document.querySelector('#collector-key')
      const button = document.querySelector('#collect-button')
      const result = document.querySelector('#collector-result')
      const query = new URLSearchParams(window.location.search)
      const queryOrigin = query.get('collectorOrigin')
      const queryKey = query.get('collectorKey')
      if (queryOrigin) originInput.value = queryOrigin
      if (queryKey) keyInput.value = queryKey

      let activeEndpoint = ''
      let collectBrowserPulse

      form.addEventListener('submit', async (event) => {
        event.preventDefault()
        const collectorOrigin = originInput.value.trim()
        const collectorKey = keyInput.value.trim()
        const endpoint = new URL(
          `/v1/browser-events/${encodeURIComponent(collectorKey)}`,
          collectorOrigin,
        ).toString()

        if (endpoint !== activeEndpoint) {
          activeEndpoint = endpoint
          collectBrowserPulse = createBrowserPulseCollector(endpoint)
        }

        button.disabled = true
        result.textContent = '正在发送采集事件…'
        const startedAt = performance.now()
        const response = await collectBrowserPulse()
        result.textContent = JSON.stringify(
          {
            ...response,
            elapsedMs: Math.round(performance.now() - startedAt),
            endpoint,
          },
          null,
          2,
        )
        button.disabled = false
      })
    </script>
  </body>
</html>
